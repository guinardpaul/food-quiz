name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/food-quiz-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/food-quiz-app

      - name: Build
        run: npm run build
        working-directory: frontend/food-quiz-app

      - name: Test
        run: npm test -- --watch=false
        working-directory: frontend/food-quiz-app

      - name: Lint
        run: npm run lint
        working-directory: frontend/food-quiz-app
